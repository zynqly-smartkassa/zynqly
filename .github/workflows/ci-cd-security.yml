name: CI/CD & Security Pipeline

on:
  push:
    branches: ["main", "develop", "feature/cidc"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # WEB: Lint + Unit-Tests
  web:
    name: Web - Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npx vitest run

  # BACKEND: Tests
  backend:
    name: Backend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Tests
        run: |
          chmod +x mvnw
          ./mvnw test

  # SECURITY SCANS
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependency Scan (npm audit)
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Trivy Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scanners: "vuln,secret"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # DEPLOYMENT (Dry Run)
  deploy:
    name: Deployment
    needs: [web, backend, security-scans]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Step
        run: echo "Deployment in progress... pray for success!"
