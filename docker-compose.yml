services:
  db:
    image: postgres:17.7
    container_name: zynqly-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=zynqly
      - POSTGRES_DB=zynqly
    ports:
      - "5432:5432"
    volumes:
      - zynqly_v17_data:/var/lib/postgresql/data
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: zynqly-swagger
    ports:
      - "8082:8080"
    volumes:
      # openapi.yaml is served from /docs ...
      - ./docs:/usr/share/nginx/html/docs
      # ... and our custom dark-themed page replaces the default index
      # (loads ./docs/openapi.yaml itself, so SWAGGER_JSON is no longer needed).
      - ./docs/swagger/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

volumes:
  zynqly_v17_data: