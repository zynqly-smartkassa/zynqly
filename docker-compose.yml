services:
  db:
    image: postgres:18
    container_name: zynqly-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=zynqly
      - POSTGRES_DB=zynqly
    ports:
      - "5432:5432"
    volumes:
      - zynqly_v18_data:/var/lib/postgresql 

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: zynqly-swagger
    ports:
      - "8081:8080"
    volumes:
      - ./docs:/usr/share/nginx/html/docs
    environment:
      - SWAGGER_JSON=/usr/share/nginx/html/docs/openapi.yaml
    restart: unless-stopped

volumes:
  zynqly_v18_data: