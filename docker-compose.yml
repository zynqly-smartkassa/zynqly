services:
  db:
    image: postgres:17.7
    container_name: zynqly-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=zynqly
      - POSTGRES_DB=zynqly
    ports:
      - "5432:5432"
    volumes:
      - zynqly_v17_data:/var/lib/postgresql/data
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: zynqly-swagger
    ports:
      - "8082:8080"
    volumes:
      # openapi.yaml is served from /docs ...
      - ./docs:/usr/share/nginx/html/docs
      # ... and our custom dark-themed page replaces the default index
      # (loads ./docs/openapi.yaml itself, so SWAGGER_JSON is no longer needed).
      - ./docs/swagger/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: zynqly-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@zynqly.dev
      - PGADMIN_DEFAULT_PASSWORD=zynqly
      # Desktop mode: no pgAdmin login form for local development.
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - zynqly_pgadmin_data:/var/lib/pgadmin
      # Pre-registers the zynqly database; pgAdmin asks for the DB password on first connect.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

volumes:
  zynqly_v17_data:
  zynqly_pgadmin_data: