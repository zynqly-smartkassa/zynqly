openapi: 3.0.0
info:
  title: Taxi Cash Register API
  description: API for managing rides and dashboard statistics for a taxi company.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Backend-Server (Java/Spring)
  - url: https://smart-kassa.vercel.app/
    description: Production Server

security:
  - bearerAuth: [ ]

paths:
  /ride:
    get:
      summary: Retrieve list of all rides
      responses:
        '200':
          description: A list of rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'
    post:
      summary: Save a new ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideInput'
      responses:
        '201':
          description: Ride successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /ride/{id}:
    get:
      summary: Retrieve details of a specific ride
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '404':
          description: Ride not found

  /dashboard:
    get:
      summary: Retrieve statistics for the dashboard
      description: Provides aggregated data such as total revenue and number of rides.
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /receipts:
    get:
      summary: Retrieve list of all receipts (overview)
      description: Provides a list of receipts with key data for tables or list views.
      responses:
        '200':
          description: A list of receipt summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceiptListDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new receipt
      description: Generates an official receipt based on a ride ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreateDto'
      responses:
        '201':
          description: Receipt successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Validation error (e.g. missing mandatory fields)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{id}:
    get:
      summary: Retrieve receipt by its unique ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          description: No receipt found for this ID
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
# COMPONENTS
components:

  parameters:
    id:
      name: id
      in: path
      description: Unique ID of specific Collection
      required: true
      schema:
        type: string


  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Enter your JWT token here. Format: Bearer <token>"

  schemas:
    Ride:
      type: object
      properties:
        id:
          type: string
          example: "123-abc-456"
        timestamp:
          type: string
          format: date-time
          example: "2024-05-20T14:30:00Z"
        distance_km:
          type: number
          format: float
          example: 12.5
        duration_min:
          type: integer
          example: 20

    RideInput:
      type: object
      required:
        - distance_km
        - total_amount
        - payment_method
      properties:
        distance_km:
          type: number
          example: 12.5
        duration_min:
          type: integer
          example: 20
        total_amount:
          type: number
          example: 35.50
        payment_method:
          type: string
          enum: [ cash, card, app ]

    DashboardStats:
      type: object
      properties:
        total_revenue:
          type: number
          example: 1540.80
        total_rides:
          type: integer
          example: 42
        average_ride_value:
          type: number
          example: 36.68
        revenue_by_payment_method:
          type: object
          properties:
            cash:
              type: number
            card:
              type: number
            app:
              type: number

    Receipt:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        ride_id:
          type: integer
          example: 500
        user_id:
          type: integer
          example: 10
        issuedAt:
          type: string
          format: date-time
          example: "2024-05-20T14:35:00Z"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        subtotal:
          type: number
          format: decimal
          example: 29.58
        taxRate:
          type: number
          format: decimal
          example: 0.19
        taxAmount:
          type: number
          format: decimal
          example: 5.62
        discountAmount:
          type: number
          format: decimal
          example: 0.00
        total:
          type: number
          format: decimal
          example: 35.20
        tip:
          type: number
          format: decimal
          example: 2.00
        amountPaid:
          type: number
          format: decimal
          example: 40.00
        change:
          type: number
          format: decimal
          example: 2.80
        currency:
          $ref: '#/components/schemas/Currency'
        receiptNumber:
          type: string
          example: "RE-2024-001"
        notes:
          type: string
          example: "Ride to the airport"

    ReceiptCreateDto:
      type: object
      required:
        - ride_id
        - paymentMethod
        - currency
        - amountPaid
      properties:
        ride_id:
          type: integer
          example: 500
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        discountAmount:
          type: number
          format: decimal
          minimum: 0.0
          default: 0.0
          example: 0.0
        notes:
          type: string
          maxLength: 255
          example: "Ride to the airport"
        currency:
          $ref: '#/components/schemas/Currency'
        tip:
          type: number
          format: decimal
          minimum: 0.0
          default: 0.0
          example: 2.50
        amountPaid:
          type: number
          format: decimal
          minimum: 0.0
          example: 40.00

    ReceiptListDto:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        receiptNumber:
          type: string
          example: "RE-2024-001"
        issuedAt:
          type: string
          format: date-time
          example: "2024-05-20T14:35:00Z"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          type: number
          format: decimal
          example: 35.20
        currency:
          $ref: '#/components/schemas/Currency'

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 500
        error:
          type: string
          example: "Internal Server Error"
        message:
          type: string
          example: "Failed to load receipts data"
        path:
          type: string
          example: "/api/v1/receipts"

    # ENUMS
    PaymentMethod:
      type: string
      enum: [ CASH, CARD, APP, OTHER ]
      example: "CASH"

    PaymentStatus:
      type: string
      enum: [ PENDING, PAID, REFUNDED, CANCELLED ]
      example: "PAID"

    Currency:
      type: string
      enum: [ EUR ]
      example: "EUR"
