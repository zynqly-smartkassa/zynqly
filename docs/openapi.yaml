openapi: 3.0.0
info:
  title: Zynqly Backend API
  description: |
    REST API for the Zynqly taxi cash-register platform.

    All routes are served under the `/api/v1` servlet context path (configured
    via `server.servlet.context-path` in `application.properties`).
    Authentication uses JWT: clients obtain a short-lived access token from
    `/auth/sign-in` (sent as `Authorization: Bearer <token>`) and a long-lived
    refresh token that the backend writes into an HTTP-only `refresh_tk`
    cookie. New access tokens can be obtained via `GET /auth/access-tk`.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local Backend-Server (Java/Spring Boot)
  - url: https://smart-kassa.vercel.app/api/v1
    description: Production Server

security:
  - bearerAuth: [ ]

tags:
  - name: Auth
    description: Sign-up, sign-in and JWT refresh endpoints
  - name: Dashboard
    description: Aggregated KPI data shown on the dashboard
  - name: Rides
    description: Raw ride data
  - name: Ride History
    description: Paginated history of completed rides
  - name: Receipts
    description: Receipts created from rides

paths:
  # =========================================================================
  # AUTH
  # =========================================================================
  /auth/sign-up:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Creates a new user, hashes the supplied password, and returns an
        access token. The matching long-lived refresh token is set as the
        HTTP-only `refresh_tk` cookie via the `Set-Cookie` response header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpAccountRequestDto'
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie:
              description: HTTP-only refresh token cookie (`refresh_tk`)
              schema:
                type: string
                example: "refresh_tk=eyJhbGciOi...; Path=/; HttpOnly; Max-Age=2592000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation error or email/phone already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Authenticate an existing user
      description: |
        Verifies the supplied credentials and returns a fresh access token.
        The long-lived refresh token is set as the HTTP-only `refresh_tk`
        cookie via the `Set-Cookie` response header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInAccountRequestDto'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: HTTP-only refresh token cookie (`refresh_tk`)
              schema:
                type: string
                example: "refresh_tk=eyJhbGciOi...; Path=/; HttpOnly; Max-Age=2592000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/access-tk:
    get:
      tags: [Auth]
      summary: Exchange the refresh-token cookie for a fresh access token
      description: |
        Reads the HTTP-only `refresh_tk` cookie from the request, validates
        it, and returns a new access token. The refresh cookie itself is not
        rotated.
      security: []
      parameters:
        - in: cookie
          name: refresh_tk
          required: true
          description: Refresh token previously issued by sign-up or sign-in
          schema:
            type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '401':
          description: Refresh token missing or invalid
          content:
            text/plain:
              schema:
                type: string
                example: "The refresh token is missing"

  # =========================================================================
  # DASHBOARD
  # =========================================================================
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Retrieve aggregated dashboard data
      description: |
        Returns the KPI cards, monthly and weekly chart data, settlement
        breakdown and top-drivers table rendered on the dashboard.
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # RIDES
  # =========================================================================
  /ride/:
    get:
      tags: [Rides]
      summary: Retrieve the list of all rides
      responses:
        '200':
          description: A list of rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rides'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # RIDE HISTORY
  # =========================================================================
  /ride-history:
    get:
      tags: [Ride History]
      summary: Retrieve paginated ride history
      description: |
        Returns a Spring Data `Page` of completed rides. Use the standard
        Spring pagination query parameters (`page`, `size`, `sort`).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 6
        - name: sort
          in: query
          description: Comma-separated `property,(asc|desc)` pairs
          schema:
            type: string
            example: "dateTime,desc"
      responses:
        '200':
          description: A paginated list of rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHistoryPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # RECEIPTS
  # =========================================================================
  /receipts:
    get:
      tags: [Receipts]
      summary: Retrieve paginated list of all receipts (overview)
      description: Provides a paginated list of receipts with key data for tables or list views.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: sortBy
          in: query
          schema:
            type: string
            default: "total"
        - name: ascending
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: A paginated list of receipt summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListPage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Receipts]
      summary: Create a new receipt
      description: Generates an official receipt based on a ride ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreateDto'
      responses:
        '201':
          description: Receipt successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Validation error (e.g. missing mandatory fields)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{id}:
    get:
      tags: [Receipts]
      summary: Retrieve receipt by its unique ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          description: No receipt found for this ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =========================================================================
# COMPONENTS
# =========================================================================
components:

  parameters:
    id:
      name: id
      in: path
      description: Unique ID of specific resource
      required: true
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token issued by `/auth/sign-in` or `/auth/access-tk`.
        Format: `Bearer <token>`.

  schemas:

    # ---------------------------------------------------------------
    # AUTH SCHEMAS
    # ---------------------------------------------------------------
    SignUpAccountRequestDto:
      type: object
      required: [name, email, phone, password, role]
      properties:
        name:
          type: string
          minLength: 2
          example: "Mario Kaya"
        email:
          type: string
          format: email
          example: "mario@example.com"
        phone:
          type: string
          minLength: 10
          example: "+4369912345678"
        password:
          type: string
          minLength: 6
          example: "supersecret"
        role:
          $ref: '#/components/schemas/Role'

    SignInAccountRequestDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 20
          example: "mario@example.com"
        password:
          type: string
          minLength: 6
          example: "supersecret"

    AuthResponseDto:
      type: object
      properties:
        accessTk:
          type: string
          description: Short-lived JWT access token
          example: "eyJhbGciOiJIUzI1NiJ9..."
        expiresIn:
          type: integer
          description: Remaining lifetime of the access token, in seconds
          example: 900

    Role:
      type: string
      enum: [ UNTERNEHMER, FAHRER, BUCHHALTER ]
      example: "UNTERNEHMER"

    # ---------------------------------------------------------------
    # ERROR SCHEMAS
    # ---------------------------------------------------------------
    ApiError:
      type: object
      description: |
        Structured error envelope used for validation and authentication
        failures. The `errors` array carries one entry per offending field
        so the frontend can attach the message to the right input.
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "There are 2 errors"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      properties:
        field:
          type: string
          example: "email"
        message:
          type: string
          example: "The used email is already taken."

    ErrorResponse:
      type: object
      description: Generic error envelope returned for 404 and 500 responses.
      properties:
        status:
          type: integer
          example: 500
        error:
          type: string
          example: "Internal Server Error"
        message:
          type: string
          example: "Failed to load receipts data"
        path:
          type: string
          example: "/api/v1/receipts"

    # ---------------------------------------------------------------
    # DASHBOARD
    # ---------------------------------------------------------------
    DashboardDto:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStat'
        monthlyData:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyData'
        weeklyData:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyData'
        settlementData:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
        topDrivers:
          type: array
          items:
            $ref: '#/components/schemas/TopDriver'

    DashboardStat:
      type: object
      properties:
        label:
          type: string
          example: "Total Revenue"
        value:
          type: string
          example: "11.340,00 €"
        rawValue:
          type: number
          format: double
          example: 11340.0
        change:
          type: string
          example: "+14,9% vs last month"
        changePercent:
          type: number
          format: double
          nullable: true
          example: 14.9
        positive:
          type: boolean
        icon:
          type: string
          enum: [revenue, rides, drivers, fare]

    MonthlyData:
      type: object
      properties:
        month:
          type: string
          example: "Jan"
        revenue:
          type: integer
        rides:
          type: integer

    WeeklyData:
      type: object
      properties:
        day:
          type: string
          example: "Mo"
        brutto:
          type: integer
        netto:
          type: integer

    Settlement:
      type: object
      properties:
        name:
          type: string
          example: "Card"
        value:
          type: integer
          description: Percentage share
          example: 62

    TopDriver:
      type: object
      properties:
        name:
          type: string
        rides:
          type: integer
        revenue:
          type: string
          example: "2.430 €"
        revenueRaw:
          type: number
          format: double
        rating:
          type: number
          format: double

    # ---------------------------------------------------------------
    # RIDES
    # ---------------------------------------------------------------
    Rides:
      type: object
      properties:
        ride_id:
          type: integer
        vehicle_id:
          type: integer
        user_id:
          type: integer
        start_address:
          type: string
        start_time:
          type: string
        end_address:
          type: string
        end_time:
          type: string
        duration:
          type: string
        distance:
          type: integer
        ride_type:
          type: string
        whole_ride:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/WholeRide'

    WholeRide:
      type: object
      description: Single waypoint inside a ride. Exact shape is data-driven.
      additionalProperties: true

    # ---------------------------------------------------------------
    # RIDE HISTORY
    # ---------------------------------------------------------------
    RideHistoryEntry:
      type: object
      properties:
        id:
          type: string
          example: "R-1042"
        dateTime:
          type: string
          format: date-time
          example: "2026-04-11T08:15:00"
        type:
          type: string
          enum: [Passagier, Boten]
        from:
          type: string
        to:
          type: string
        amount:
          type: number
          format: decimal
        settlement:
          type: string
          enum: [card, cash]
        status:
          type: string
          enum: [completed, cancelled, pending]

    RideHistoryPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RideHistoryEntry'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------------------------------------------------------------
    # RECEIPTS
    # ---------------------------------------------------------------
    Receipt:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        ride_id:
          type: integer
          example: 500
        user_id:
          type: integer
          example: 10
        issuedAt:
          type: string
          format: date-time
          example: "2024-05-20T14:35:00Z"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        subtotal:
          type: number
          format: decimal
          example: 29.58
        taxRate:
          type: number
          format: decimal
          example: 0.19
        taxAmount:
          type: number
          format: decimal
          example: 5.62
        discountAmount:
          type: number
          format: decimal
          example: 0.00
        total:
          type: number
          format: decimal
          example: 35.20
        tip:
          type: number
          format: decimal
          example: 2.00
        amountPaid:
          type: number
          format: decimal
          example: 40.00
        change:
          type: number
          format: decimal
          example: 2.80
        currency:
          $ref: '#/components/schemas/Currency'
        receiptNumber:
          type: string
          example: "RE-2024-001"
        notes:
          type: string
          example: "Ride to the airport"
        rideType:
          $ref: '#/components/schemas/RideType'

    ReceiptCreateDto:
      type: object
      required:
        - ride_id
        - paymentMethod
        - currency
        - subtotal
        - amountPaid
      properties:
        ride_id:
          type: integer
          example: 500
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        subtotal:
          type: number
          format: decimal
          minimum: 0.0
          example: 32.50
          description: Base ride price before tax and discounts
        discountAmount:
          type: number
          format: decimal
          minimum: 0.0
          default: 0.0
          example: 0.0
        notes:
          type: string
          maxLength: 255
          example: "Ride to the airport"
        currency:
          $ref: '#/components/schemas/Currency'
        tip:
          type: number
          format: decimal
          minimum: 0.0
          default: 0.0
          example: 2.50
        amountPaid:
          type: number
          format: decimal
          minimum: 0.0
          example: 40.00
          description: Amount actually handed over by the customer (cash or charged amount)
        rideType:
          $ref: '#/components/schemas/RideType'

    ReceiptListDto:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        receiptNumber:
          type: string
          example: "RE-2024-001"
        issuedAt:
          type: string
          format: date-time
          example: "2024-05-20T14:35:00Z"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          type: number
          format: decimal
          example: 35.20
        currency:
          $ref: '#/components/schemas/Currency'

    ReceiptListPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptListDto'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          example: 10
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 5

    # ENUMS
    PaymentMethod:
      type: string
      enum: [ CASH, CARD, APP, OTHER ]
      example: "CASH"

    PaymentStatus:
      type: string
      enum: [ PENDING, PAID, REFUNDED, CANCELLED ]
      example: "PAID"

    Currency:
      type: string
      enum: [ EUR ]
      example: "EUR"

    RideType:
      type: string
      enum: [ BOTENFAHRT,
              PERSONENFAHRT ]
      example: "PERSONENFAHRT"
