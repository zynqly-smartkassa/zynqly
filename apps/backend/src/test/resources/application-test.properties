spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.level.org.springframework.web=TRACE
# This will re-create the schema in each test iteration
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy JWT secret for tests only (application-local.properties is gitignored, so CI has no secret)
jwt.secret=test-only-jwt-secret-not-for-production-use-0123456789


